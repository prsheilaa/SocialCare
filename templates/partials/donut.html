<div class="donut-wrap">
  <div class="donut" data-bg="{{ s.gradient }}"><div><b>{{ s.total }}</b><small>komentar</small></div></div>
  <div class="legend">
    <div><i class="dot pos"></i><span>Positif</span><b>{{ s.pos_p }}%</b><small>{{ s.pos }}</small></div>
    <div><i class="dot net"></i><span>Netral</span><b>{{ s.net_p }}%</b><small>{{ s.net }}</small></div>
    <div><i class="dot neg"></i><span>Negatif</span><b>{{ s.neg_p }}%</b><small>{{ s.neg }}</small></div>
  </div>
</div>
